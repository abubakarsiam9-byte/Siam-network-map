name: Build Siam Network Map APK

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/build-apk.yml"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Create Android project
        run: |
          mkdir -p app/src/main/java/com/siam/networkmap
          mkdir -p app/src/main/res/values
          mkdir -p app/src/main/res/drawable
          mkdir -p app/src/main/res/mipmap-anydpi-v26
          mkdir -p app/src/main/res/mipmap

          cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }

          rootProject.name = "SiamNetworkMap"
          include(":app")
          EOF

          cat > build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.7.3' apply false
          }
          EOF

          cat > gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          EOF

          cat > app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.siam.networkmap'
              compileSdk 35

              defaultConfig {
                  applicationId 'com.siam.networkmap'
                  minSdk 23
                  targetSdk 35
                  versionCode 2
                  versionName '1.1'
              }
          }
          EOF

          cat > app/src/main/res/values/colors.xml <<'EOF'
          <resources>
              <color name="icon_blue">#0867F2</color>
              <color name="icon_dark">#061B4F</color>
          </resources>
          EOF

          cat > app/src/main/res/values/strings.xml <<'EOF'
          <resources>
              <string name="app_name">Siam Network Map</string>
          </resources>
          EOF

          cat > app/src/main/res/values/themes.xml <<'EOF'
          <resources>
              <style name="AppTheme" parent="android:style/Theme.Material.Light.NoActionBar">
                  <item name="android:fontFamily">sans</item>
                  <item name="android:colorAccent">#0867F2</item>
                  <item name="android:navigationBarColor">#000000</item>
                  <item name="android:statusBarColor">#061B4F</item>
              </style>
          </resources>
          EOF

          cat > app/src/main/res/drawable/ic_launcher.xml <<'EOF'
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp"
              android:height="108dp"
              android:viewportWidth="108"
              android:viewportHeight="108">

              <path
                  android:fillColor="#061B4F"
                  android:pathData="M0,0h108v108h-108z"/>

              <path
                  android:fillColor="#0867F2"
                  android:pathData="M54,13C34,13 18,29 18,49c0,27 36,49 36,49s36,-22 36,-49C90,29 74,13 54,13z"/>

              <path
                  android:fillColor="#FFFFFF"
                  android:pathData="M54,31a11,11 0,1 0,0 22a11,11 0,0 0,0 -22z"/>

              <path
                  android:fillColor="#FFFFFF"
                  android:pathData="M49,49h10l8,27h-7l-3,-10h-6l-3,10h-7z"/>

              <path
                  android:fillColor="#39E67A"
                  android:pathData="M20,82h23v5h-23z"/>

              <path
                  android:fillColor="#39E67A"
                  android:pathData="M65,82h23v5h-23z"/>

              <path
                  android:fillColor="#39E67A"
                  android:pathData="M29,75h5v18h-5z"/>

              <path
                  android:fillColor="#39E67A"
                  android:pathData="M74,75h5v18h-5z"/>
          </vector>
          EOF

          cat > app/src/main/res/drawable/ic_launcher_foreground.xml <<'EOF'
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp"
              android:height="108dp"
              android:viewportWidth="108"
              android:viewportHeight="108">

              <path
                  android:fillColor="#FFFFFF"
                  android:pathData="M54,30a10,10 0,1 0,0 20a10,10 0,0 0,0 -20z"/>

              <path
                  android:fillColor="#FFFFFF"
                  android:pathData="M49,47h10l9,31h-7l-3,-11h-8l-3,11h-7z"/>

              <path
                  android:fillColor="#39E67A"
                  android:pathData="M15,80h24v6h-24z"/>

              <path
                  android:fillColor="#39E67A"
                  android:pathData="M69,80h24v6h-24z"/>
          </vector>
          EOF

          cat > app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml <<'EOF'
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
              <background android:drawable="@color/icon_dark"/>
              <foreground android:drawable="@drawable/ic_launcher_foreground"/>
          </adaptive-icon>
          EOF

          cp app/src/main/res/drawable/ic_launcher.xml app/src/main/res/mipmap/ic_launcher.xml

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="android.permission.INTERNET"/>
              <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION"/>
              <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION"/>

              <application
                  android:theme="@style/AppTheme"
                  android:label="@string/app_name"
                  android:icon="@mipmap/ic_launcher"
                  android:roundIcon="@mipmap/ic_launcher"
                  android:usesCleartextTraffic="true"
                  android:allowBackup="false">

                  <activity
                      android:name=".MainActivity"
                      android:screenOrientation="portrait"
                      android:exported="true">

                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>

                  </activity>
              </application>

          </manifest>
          EOF

          cat > app/src/main/java/com/siam/networkmap/MainActivity.java <<'EOF'
          package com.siam.networkmap;

          import android.Manifest;
          import android.app.Activity;
          import android.os.Bundle;
          import android.content.pm.PackageManager;
          import android.webkit.GeolocationPermissions;
          import android.webkit.WebChromeClient;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;

          public class MainActivity extends Activity {

              private WebView web;

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);

                  web = new WebView(this);
                  setContentView(web);

                  WebSettings s = web.getSettings();
                  s.setJavaScriptEnabled(true);
                  s.setDomStorageEnabled(true);
                  s.setDatabaseEnabled(true);
                  s.setGeolocationEnabled(true);
                  s.setAllowFileAccess(true);
                  s.setAllowContentAccess(true);

                  web.setWebViewClient(new WebViewClient());

                  web.setWebChromeClient(new WebChromeClient() {
                      @Override
                      public void onGeolocationPermissionsShowPrompt(
                              String origin,
                              GeolocationPermissions.Callback callback) {

                          if (checkSelfPermission(
                                  Manifest.permission.ACCESS_FINE_LOCATION)
                                  != PackageManager.PERMISSION_GRANTED) {

                              requestPermissions(
                                      new String[]{
                                              Manifest.permission.ACCESS_FINE_LOCATION,
                                              Manifest.permission.ACCESS_COARSE_LOCATION
                                      },
                                      100);
                          }

                          callback.invoke(origin, true, false);
                      }
                  });

                  web.loadUrl(
                      "https://abubakarsiam9-byte.github.io/Siam-network-map/"
                  );
              }

              @Override
              public void onBackPressed() {
                  if (web.canGoBack()) {
                      web.goBack();
                  } else {
                      super.onBackPressed();
                  }
              }
          }
          EOF

      - name: Build APK
        run: gradle assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Siam-network-map-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apkapk
